<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>📝 My To-Do List</h1>
            <p class="subtitle">Stay organized and boost productivity</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Section -->
            <section class="input-section">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="taskInput" 
                        class="task-input" 
                        placeholder="Add a new task..."
                        autocomplete="off"
                    >
                    <div class="priority-select">
                        <select id="prioritySelect" class="priority-dropdown">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <button id="addBtn" class="btn btn-add">➕ Add</button>
                </div>
                <div class="date-input-group">
                    <input type="date" id="dueDateInput" class="due-date-input">
                    <span class="date-label">Due Date (Optional)</span>
                </div>
            </section>

            <!-- Filter Section -->
            <section class="filter-section">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                    <button class="filter-btn" data-filter="high">🔴 High Priority</button>
                </div>
                <div class="sort-section">
                    <select id="sortSelect" class="sort-dropdown">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="priority">Priority</option>
                        <option value="duedate">Due Date</option>
                    </select>
                </div>
            </section>

            <!-- Statistics -->
            <section class="stats-section">
                <div class="stat-card">
                    <span class="stat-label">Total Tasks</span>
                    <span class="stat-value" id="totalTasks">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Completed</span>
                    <span class="stat-value" id="completedTasks">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Active</span>
                    <span class="stat-value" id="activeTasks">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Completion %</span>
                    <span class="stat-value" id="completionPercent">0%</span>
                </div>
            </section>

            <!-- Tasks List -->
            <section class="tasks-section">
                <div id="tasksList" class="tasks-list">
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <p>No tasks yet. Add one to get started!</p>
                    </div>
                </div>
            </section>

            <!-- Action Buttons -->
            <section class="action-buttons">
                <button id="clearCompletedBtn" class="btn btn-secondary">🗑️ Clear Completed</button>
                <button id="deleteAllBtn" class="btn btn-danger">❌ Delete All</button>
                <button id="exportBtn" class="btn btn-info">📥 Export Data</button>
                <button id="importBtn" class="btn btn-info">📤 Import Data</button>
                <input type="file" id="importFile" class="hidden-input" accept=".json">
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>✨ Productivity starts here | Data saved automatically to local storage</p>
        </footer>
    </div>

    <!-- Task Template (Hidden) -->
    <template id="taskTemplate">
        <div class="task-item" data-id="">
            <div class="task-checkbox">
                <input type="checkbox" class="task-check">
                <label class="checkmark"></label>
            </div>
            <div class="task-content">
                <div class="task-header">
                    <p class="task-text"></p>
                    <span class="priority-badge"></span>
                </div>
                <div class="task-meta">
                    <span class="task-date"></span>
                    <span class="task-created"></span>
                </div>
            </div>
            <div class="task-actions">
                <button class="btn-edit" title="Edit task">✏️</button>
                <button class="btn-delete" title="Delete task">🗑️</button>
            </div>
        </div>
    </template>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Edit Task</h2>
            <input type="text" id="editTaskInput" class="task-input" placeholder="Edit task...">
            <div class="modal-form-group">
                <label>Priority:</label>
                <select id="editPrioritySelect" class="priority-dropdown">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
            <div class="modal-form-group">
                <label>Due Date:</label>
                <input type="date" id="editDueDateInput" class="due-date-input">
            </div>
            <div class="modal-actions">
                <button id="saveEditBtn" class="btn btn-add">Save Changes</button>
                <button class="btn btn-secondary close-modal">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
